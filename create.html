
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء متجر جديد</title>
    <link rel="stylesheet" href="styel.css"/>
</head>
<body>
    <header>
        <h1>إنشاء متجر جديد</h1>
        <a href="index.html">← الرجوع للرئيسية</a>
        <hr>
    </header>
    <main>
        <form onsubmit="createStore(event)">
            <legend>1- معلومات المتجر</legend>
            <label>اسم المتجر: <input type="text" name="store_name" required placeholder="مثال: متجر الأناقة"></label><br><br>
            <label>رابط المتجر: <input type="text" name="store_link" required> .storak.com</label><br><br>
            
            <label>نوع النشاط: </label>
            <select name="category" required>
                <option value="">-- اختر النشاط --</option>
                <option value="clothes">ملابس وأزياء</option>
                <option value="electronics">إلكترونيات</option>
                <option value="food">مطاعم وحلويات</option>
            </select>
            <br><br>

            <fieldset>
                <legend>2- معلومات صاحب المتجر</legend>
                <label>البريد الإلكتروني: <input type="email" name="email" required></label><br><br>
                <label>كلمة المرور: <input type="password" name="password" required></label><br><br>
                <label>تأكيد كلمة المرور: <input type="password" name="confirm_password" required></label>
            </fieldset>
            <br>
            <fieldset>
                <legend>3- اختر قالب المتجر</legend>
                <input type="radio" name="template" value="classic" checked> الكلاسيكي<br>
                <input type="radio" name="template" value="modern"> العصري<br>
               <input type="radio" name="template" value="simple"> القالب البسيط<br>
            </fieldset>
            <br>
            <input type="checkbox" name="terms" required> أوافق على الشروط<br><br>
            <button type="submit">إنشاء متجري الآن</button>
        </form>
    </main>
    <script src="main.js"></script>
</body>
</html>

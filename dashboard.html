<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="styel.css">
</head>
<body>
    <header>
        <h1>لوحة التحكم</h1>
        <p id="welcome">مرحباً بك</p>
        <a href="index.html" onclick="logout(); return false;">خروج</a>
    </header>

    <main>
        <h3>إضافة منتج</h3>
        <form onsubmit="addProduct(event)">
            <input type="text" id="pName" placeholder="اسم المنتج" required>
            <input type="number" id="pPrice" placeholder="السعر" required>
            <input type="number" id="pQty" placeholder="الكمية" required>
            <button type="submit">حفظ</button>
        </form>

        <br>
        <h3>منتجاتي - <span id="totalProducts">0 منتج</span></h3>
        <table width="100%" border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>السعر</th>
                    <th>الكمية</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="productsTable">
                <tr><td colspan="4">لا يوجد منتجات بعد</td></tr>
            </tbody>
        </table>
    </main>

    <script src="main.js"></script>
</body>
</html>

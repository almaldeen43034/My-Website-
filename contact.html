        <h2>تواصل معنا</h2>
        <p>عندك سؤال؟ فريقنا جاهز يرد عليك في أقل من 24 ساعة</p>

        <form action="index.html" method="get">
            <label>الاسم الكامل:</label><br>
            <input type="text" name="fullname" placeholder="اكتب اسمك" required><br><br>

            <label>البريد الإلكتروني:</label><br>
            <input type="email" name="email" placeholder="example@email.com" required><br><br>

            <label>موضوع الرسالة:</label><br>
            <select name="subject" required>
                <option value="">-- اختر الموضوع --</option>
                <option value="support">دعم فني</option>
                <option value="sales">استفسار عن الأسعار</option>
                <option value="templates">مشكلة في القوالب</option>
                <option value="other">أخرى</option>
            </select><br><br>

            <label>الرسالة:</label><br>
            <textarea name="message" rows="5" cols="30" placeholder="اكتب رسالتك هنا..." required></textarea><br><br>

            <button type="submit">إرسال الرسالة</button>
        </form>
